version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: csis_user
      POSTGRES_PASSWORD: csis_password
      POSTGRES_DB: csis_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

