services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: csis_user
      POSTGRES_PASSWORD: csis_password
      POSTGRES_DB: csis_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csis_user -d csis_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://csis_user:csis_password@db:5432/csis_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-antes-de-usar-em-producao}
      JWT_EXPIRES_IN: "1d"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5000}
      PORT: 3000
      SEED_ADMIN_NOME: ${SEED_ADMIN_NOME:-Administrador}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@csis.local}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-TrocarSenha123}
    restart: unless-stopped

  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./frontend/build/web:/usr/share/nginx/html
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  # Serviria o build estático do Flutter Web (frontend/build/web, gerado com
  # `flutter build web`) — deixado comentado de propósito: por enquanto o
  # projeto roda só localmente, sem publicação pública (decisão já tomada).
  # Pra ativar: gerar o build web e descomentar este serviço.

volumes:
  pgdata:
